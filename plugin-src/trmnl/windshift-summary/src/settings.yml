#
# TRMNL private plugin definition. `trmnlp pull` overwrites this file, so keep
# edits in sync with the hosted plugin if you ever push it.
#
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data:
polling_verb: get
framework_version: latest
serverless_language:
polling_url: |-
  {{ windshift_url | strip | append: '/rest/api/v2/users/me' | replace: '//rest/', '/rest/' }}
  {{ windshift_url | strip | append: '/rest/api/v2/items' | replace: '//rest/', '/rest/' }}?ql={{ scope_query | strip | url_encode }}&page_size=1&sort=-updated_at
  {{ windshift_url | strip | append: '/rest/api/v2/items' | replace: '//rest/', '/rest/' }}?ql=({{ scope_query | strip | url_encode }})%20AND%20due_date%20%3C%20%22{{ 'now' | date: '%Y-%m-%d' }}%22&page_size=1
  {{ windshift_url | strip | append: '/rest/api/v2/items' | replace: '//rest/', '/rest/' }}?ql=({{ scope_query | strip | url_encode }})%20AND%20due_date%20%3C%3D%20%22{{ 'now' | date: '%Y-%m-%d' }}%22&page_size=1
  {{ windshift_url | strip | append: '/rest/api/v2/items' | replace: '//rest/', '/rest/' }}?ql=({{ scope_query | strip | url_encode }})%20AND%20due_date%20%3E%3D%20%22{{ 'now' | date: '%Y-%m-%d' }}%22&page_size=1&sort=due_date
  {{ windshift_url | strip | append: '/rest/api/v2/items' | replace: '//rest/', '/rest/' }}?ql=assignee%20%3D%20currentUser()%20AND%20status%20%3D%20Done%20AND%20completed_at%20%3E%3D%20%22{{ 'now' | date: '%Y-%m-%d' }}%22&page_size=1
  {{ windshift_url | strip | append: '/rest/api/v2/items' | replace: '//rest/', '/rest/' }}?ql=updated%20%3E%3D%20%22{{ 'now' | date: '%Y-%m-%d' }}%22&page_size=12&sort=-updated_at
  {% if milestone_workspace_id != blank %}{{ windshift_url | strip | append: '/rest/api/v2/workspaces/' | append: milestone_workspace_id | append: '/milestones' | replace: '//rest/', '/rest/' }}?status=in-progress&page_size=1
  {{ windshift_url | strip | append: '/rest/api/v2/workspaces/' | append: milestone_workspace_id | append: '/milestones' | replace: '//rest/', '/rest/' }}?status=planning&page_size=1{% endif %}
polling_headers: Authorization=Bearer {{ api_token | strip }}&Accept=application/json
#
# Nine requests per refresh when a milestone workspace is configured, seven
# otherwise (the two milestone lines are emitted only when the
# milestone_workspace_id field is set — see the IDX legend in shared.liquid).
#
polling_body:
id: 479344
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: windshift_url
  field_type: url
  name: Windshift Server URL
  placeholder: https://windshift.example.com
  description: Base URL of your Windshift server
  help_text: Just the origin — no /rest/api/v2 suffix. A trailing slash is fine.
  required: true
- keyname: api_token
  field_type: password
  name: API Token
  placeholder: crw_...
  description: A personal Windshift API token
  help_text: Create one under Profile > API Tokens. It needs the items:read and users:read scopes.
  required: true
- keyname: scope_query
  field_type: string
  name: Scope
  default: assignee = currentUser() AND status != Done
  description: The backlog the stats describe
  help_text: Windshift QL. The due, overdue and priority counts are all derived from this set.
  required: true
- keyname: milestone_workspace_id
  field_type: string
  name: Milestone workspace ID
  placeholder: '2'
  description: Workspace whose roadmap feeds the Next-up milestone row
  help_text: Optional. The numeric workspace ID (visible in the workspace URL in Windshift). Leave blank to hide the milestone row. Uses the same items:read token scope.
  required: false
name: Windshift Daily Summary
description: Today at a glance in Windshift
refresh_interval: 30
